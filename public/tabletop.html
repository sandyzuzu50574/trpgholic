const r=radius();
dice.forEach(d=>{
const rr=r*(1+d.z/380),yy=d.y-d.z*.38,m=meshes[d.s],ps=m.v.map(p=>project(p,d));
ctx.save();ctx.translate(d.x,yy);
m.f.map(f=>({...f,z:f.ids.reduce((s,i)=>s+ps[i][2],0)/f.ids.length})).sort((a,b)=>a.z-b.z).forEach(f=>{
ctx.beginPath();f.ids.forEach((id,k)=>{const p=ps[id];k?ctx.lineTo(p[0]*rr,p[1]*rr):ctx.moveTo(p[0]*rr,p[1]*rr)});ctx.closePath();ctx.fillStyle='#fbfdfc';ctx.fill();ctx.strokeStyle='#0d8b67';ctx.lineWidth=1.6;ctx.stroke();});
ctx.restore();
const b=buttons[d.i];b.hidden=false;b.style.width=b.style.height=(rr*2+18)+'px';b.style.transform='translate('+(d.x-rr-9)+'px,'+(yy-rr-9)+'px)';
});
}
function step(dt){
const r=radius();
dice.forEach(d=>{
d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;
if(d.z>0||d.vz>0)d.vz-=720*dt;
if(d.z<0){d.z=0;d.vz=Math.abs(d.vz)>42?-d.vz*.28:0;}
const f=Math.exp(-(d.z>1?.5:3.1)*dt);d.vx*=f;d.vy*=f;d.spin*=f;d.a+=d.spin*dt;
const lx=r+16,hx=w-r-16,ly=h*.38+r,hy=h-r-85;
if(d.x<lx){d.x=lx;d.vx=Math.abs(d.vx)*.65;}if(d.x>hx){d.x=hx;d.vx=-Math.abs(d.vx)*.65;}
if(d.y<ly){d.y=ly;d.vy=Math.abs(d.vy)*.65;}if(d.y>hy){d.y=hy;d.vy=-Math.abs(d.vy)*.65;}
});
for(let i=0;i<7;i++)for(let j=i+1;j<7;j++){
const a=dice[i],b=dice[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
if(dist<r*2+5&&Math.abs(a.z-b.z)<r){
const nx=dist?dx/dist:1,ny=dist?dy/dist:0,overlap=r*2+5-dist;
a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;
const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
if(rel<0){const force=-rel*.8;a.vx-=force*nx;a.vy-=force*ny;b.vx+=force*nx;b.vy+=force*ny;a.spin-=rel*.012;b.spin+=rel*.012;}
}}
}
function finish(){running=false;dice.forEach(d=>{d.vx=d.vy=d.vz=d.z=d.spin=0;});draw();if(first){first=false;hand.classList.add('withdraw');hint.classList.add('ready');}status.textContent='骰子已停下。點任一顆可以再擲一次。';root.dataset.state='settled';}
function frame(t){const dt=Math.min((t-last)/1000||.016,.032);last=t;age+=dt;for(let i=0;i<3;i++)step(dt/3);draw();if(age>1&&dice.every(d=>Math.hypot(d.vx,d.vy)<2&&d.z<1)||age>7){finish();return;}raf=requestAnimationFrame(frame);}
function roll(index){
if(!entered&&index!==undefined)return;entered=true;rollCount++;root.dataset.rollCount=String(rollCount);age=0;
const chosen=index===undefined?dice:[dice[index]];
chosen.forEach((d,k)=>{
if(index===undefined){d.x=w*.72+(k%3)*radius()*1.7;d.y=h*.66+Math.floor(k/3)*radius()*1.6;}
d.z=reduce.matches?0:35;d.vz=reduce.matches?0:210;
const a=index===undefined?Math.PI*1.22+(Math.random()-.5)*.7:Math.random()*Math.PI*2;
const speed=index===undefined?w*.65:100+Math.random()*110;
d.vx=Math.cos(a)*speed;d.vy=Math.sin(a)*speed;d.spin=(Math.random()-.5)*12;
});
if(reduce.matches){if(index===undefined)dice.forEach((d,i)=>{d.x=w*(.17+(i%4)*.21);d.y=h*(.49+Math.floor(i/4)*.21);});chosen.forEach(d=>d.a+=1.2);finish();return;}
status.textContent='骰子滾動中';root.dataset.state='rolling';if(!running){running=true;last=0;raf=requestAnimationFrame(frame);}
}
buttons.forEach((b,i)=>b.addEventListener('click',()=>roll(i)));
new ResizeObserver(resize).observe(canvas);resize();
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else if(running){last=0;raf=requestAnimationFrame(frame);}});
window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));
function clamp01(v){return Math.max(0,Math.min(1,v));}
function applyProgress(progress){
  const p=clamp01(Number(progress)||0), diceFade=1-clamp01((p-.05)/.22), stageIn=clamp01((p-.08)/.18);
  root.classList.toggle('transitioning',p>.025);
  root.dataset.progress=p.toFixed(3);
  canvas.style.opacity=String(diceFade);
  hand.style.opacity=String(diceFade);
  book.style.opacity=String(1-clamp01((p-.06)/.18));
  buttons.forEach(b=>{b.style.opacity=String(diceFade);b.style.pointerEvents=p<.08?'auto':'none';});
  stage.style.opacity=String(stageIn);
  const closePhase=clamp01((p-.10)/.30), openPhase=clamp01((p-.30)/.34), fillPhase=clamp01((p-.62)/.38);
  focusBook.style.opacity=String(stageIn*(1-openPhase));
  focusBook.style.transform='translate(-50%,-50%) scale('+(0.95+closePhase*.30)+') rotate(' + (-6+closePhase*5) + 'deg) rotateY(' + (-openPhase*74) + 'deg)';
  const paperPhase=clamp01((p-.40)/.20),bookExit=clamp01((p-.58)/.30);
  stage.style.setProperty('--page-fill',String(paperPhase));
  openBook.style.opacity=String(openPhase*(1-bookExit));
  openBook.style.transform='translate(calc(-50% - '+(bookExit*38)+'vw),-50%) scale('+(0.78+openPhase*.22+bookExit*.08)+') rotate('+(openPhase*5.5)+'deg)';
  pagePreview.style.opacity=String(clamp01((p-.42)/.22));
  pagePreview.classList.toggle('ink-visible',p>.42);
  const writePhase=clamp01((p-.42)/.34), total=quoteChars.length;
  quoteChars.forEach((character,index)=>{
    const local=clamp01(writePhase*total-index);
    character.style.opacity=String(local);
    character.style.clipPath='inset(0 '+((1-local)*100)+'% 0 0)';
    character.style.filter='blur('+((1-local)*3.2)+'px)';
  });
  quoteSource.style.opacity=String(clamp01((writePhase-.78)/.22));
  quoteSource.style.transform='translateY('+(8*(1-clamp01((writePhase-.78)/.22)))+'px)';
  inkHead.style.left=(8+writePhase*84)+'%';
  inkHead.style.opacity=String(writePhase>0&&writePhase<.99?.72:0);
  document.querySelectorAll('.ink-stain').forEach((stain,index)=>{
    const wave=clamp01(1-Math.abs(writePhase-(.2+index*.26))/.34);
    stain.style.opacity=String(wave*.32);
    stain.style.transform='scale('+(0.55+wave*.72)+')';
  });
  pagePreview.style.transform='translate(-50%,-50%) scale('+(0.9+fillPhase*.12)+')';
}
window.addEventListener('message',event=>{if(event.data?.type==='notebook-progress')applyProgress(event.data.progress);});
hint.addEventListener('click',e=>{if(window.parent===window)return;e.preventDefault();try{const wrapper=window.frameElement?.parentElement;if(wrapper){window.parent.scrollTo({top:wrapper.offsetTop+wrapper.offsetHeight-window.parent.innerHeight+2,behavior:reduce.matches?'auto':'smooth'});return;}}catch(error){}window.parent.postMessage({type:'open-notebook-request'},'*');});
Promise.all([...document.images].map(im=>im.decode().catch(()=>{}))).then(()=>{root.classList.add('arrive');root.dataset.state='settled';hint.classList.add('ready');status.textContent='向下滑動，翻開跑團筆記。';});
})();</script>
