<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>灰燼中的希望｜一頁式互動角色卡</title>
<style>
:root{--ink:#24343e;--navy:#273a45;--accent:#3d7774;--mint:#e8f3f0;--line:#d7e2e3;--sand:#c6a775;--paper:#fff;--muted:#6d858a;--back:#edf2f3;--shadow:0 5px 17px #293f4910}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;color:var(--ink);background:var(--back);font:14.5px/1.45 'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif}
button,textarea,select{font:inherit}button,select{cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #6eb7ad;outline-offset:2px}
button{touch-action:manipulation}
.toolbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#f6fbfb;min-height:54px;display:flex;align-items:center;gap:12px;padding:7px clamp(12px,1.4vw,24px);box-shadow:0 2px 12px #1d303a24}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.sigil{border:1px solid #d2b58b;color:#dfc6a3;width:31px;height:31px;display:grid;place-items:center;transform:rotate(45deg);border-radius:3px;font-size:26px}.sigil span{transform:rotate(-45deg)}.brand b{display:block;letter-spacing:.09em;font:700 16px/1.2 Georgia,serif}.brand small{display:block;font-size:11.5px;color:#b2c9ca;margin-top:3px}
.chooser{margin-right:auto;min-width:0;display:flex;align-items:center;gap:7px}.chooser label{font-size:12.5px;color:#bfd0d0}.chooser select{background:#415762;color:#fff;border:1px solid #708891;padding:6px 23px 6px 10px;border-radius:7px;max-width:240px;font-weight:650}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.action{border:1px solid #799098;background:transparent;border-radius:7px;color:#fff;padding:6px 9px;min-height:32px;font-size:12.5px;white-space:nowrap}.action:hover{background:#425f68}.action.prominent{background:#dfedeb;color:#284745;border-color:#dfedeb;font-weight:700}.action.prominent:hover{background:#cee4e0}
.shell{max-width:1780px;margin:0 auto;padding:12px 15px 5px}
.mast{display:grid;grid-template-columns:minmax(240px,1.07fr) minmax(300px,1.27fr) minmax(315px,1.35fr);gap:9px;min-height:116px;margin-bottom:9px}
.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.hero{display:flex;align-items:center;gap:11px;padding:9px 13px}.hero img{width:78px;height:96px;object-fit:contain;flex:none;background:linear-gradient(135deg,#f6f8f7,#ebeeee);border:1px solid #e2e9e9;border-radius:7px}.hero h1{font-size:20px;margin:0 0 4px;line-height:1.25}.sub{font-size:12.5px;color:#6f858b}.herochips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.herochips span{font-size:11.5px;background:#eff5f3;padding:3px 5px;border-radius:4px;color:#466a68}.altlabel{font-size:11.5px;color:#7a8d92}
.defenses{display:grid;grid-template-columns:repeat(3,1fr)}.defense{padding:9px 5px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:3px}.defense:not(:last-child){border-right:1px solid var(--line)}.defense .dt{font-size:11.5px;font-weight:700;color:#60757e}.defense .dv{font-size:26px;font-weight:800;line-height:1.1}.att{display:flex;justify-content:center;gap:7px;white-space:nowrap;font-size:11.5px}.att strong{color:#2b706b}
.resources{display:flex;align-items:stretch;min-width:0}.resource{display:flex;flex-direction:column;gap:4px;justify-content:center;align-items:center;flex:1;min-width:0;padding:7px 2px;border-right:1px solid var(--line)}.resource .label{font-size:12.5px;color:#68818a;font-weight:750}.resource .step{display:flex;align-items:center;gap:4px}.resource .number{font-size:23px;line-height:24px;font-weight:800;min-width:22px;text-align:center}.resource .max{color:#83989a;font-size:12.5px}.stepbutton{width:24px;height:24px;background:#e8f3f0;border:1px solid #cbdeda;color:#3f7873;border-radius:6px;padding:0;font-size:18px;font-weight:800}.stepbutton:hover{background:#cfe6e0}.money{width:69px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:#70878a;gap:5px}.money strong{color:#856b3c;font-size:25px}
.introline{display:flex;gap:7px;align-items:center;justify-content:space-between;font-size:12.5px;color:#748b8d;margin:0 0 8px}.introline strong{font-size:13.5px;color:#3f6267}.quick-actions{display:flex;gap:7px}.mini{border:1px solid #cadcdb;border-radius:6px;background:white;color:#446e69;padding:4px 9px;font-size:12.5px}.mini:hover{background:#e6f2ef}
.board{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(470px,1.4fr) minmax(320px,1.29fr);gap:9px;align-items:start}.column{display:flex;flex-direction:column;gap:9px;min-width:0}
.panel>summary{list-style:none;cursor:pointer;display:flex;gap:7px;align-items:center;min-height:37px;padding:7px 11px;background:#f7f9f9;border-bottom:1px solid transparent;color:#29414c;font-weight:800;font-size:13.5px;user-select:none}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary:hover{background:#eaf3f1}
.panel[open]>summary{border-bottom-color:var(--line);background:#f2f7f6}
.panel>summary::before{content:'▸';font-size:14.5px;color:#4f817d;display:inline-block;flex:none;transition:transform .12s}
.panel[open]>summary::before{transform:rotate(90deg)}
.panel>summary .meta{font-size:11.5px;color:#7d9295;font-weight:500;margin-left:auto;text-align:right}
.panel>summary .preview{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:50%;font-weight:500;font-size:11.5px;color:#788f94}
.body{padding:9px 10px}
.panel p{margin:0 0 7px}.panel p:last-child{margin-bottom:0}
.skills .body{padding:6px}.skills-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.skills-col{display:flex;flex-direction:column;gap:3px}.skill{display:flex;align-items:center;gap:3px;padding:3px 5px;min-height:27px;border:1px solid #e2eceb;background:#f8fbfa;border-radius:5px}.skill .num{font-weight:800;color:#25645e;min-width:18px;font-size:12.5px}.skill .name{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.skill button{border:1px solid #d1dfdd;color:#37716e;background:#ecf5f3;border-radius:4px;font-size:11.5px;line-height:17px;min-width:62px;padding:0 2px;white-space:nowrap}.skill button:hover{background:#d6eae5}.skill button[aria-label]{text-align:center}
.weapons .body{padding:5px 9px 8px}.weapon{border:1px solid #e1e8e9;border-radius:7px;margin:5px 0;background:#fff}.weapon>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 9px}.weapon>summary::-webkit-details-marker{display:none}.weapon>summary::before{content:'+';font-weight:800;color:#3d7e79;font-size:14.5px}.weapon[open]>summary::before{content:'−'}.weapon-name{font-size:12.5px;font-weight:750;min-width:0}.weapon-blurb{font-size:11.5px;margin-left:auto;color:#597d78;text-align:right;max-width:49%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.weapon-text{padding:8px 10px;border-top:1px dashed #d7e5e3;background:#f8fbfa;font-size:12.5px;line-height:1.7;white-space:pre-wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:11.5px;padding:4px 7px;border:1px solid #dfe7e8;border-radius:5px;background:#f4f8f8;color:#3e5d62}
.eyebrow{font-size:11.5px;font-weight:800;color:#70868c;margin:5px 0 4px}.copy{white-space:pre-wrap;font-size:12.5px;line-height:1.67;overflow-wrap:anywhere}.text-preview{color:#556c70;font-size:12.5px;line-height:1.5}.quote{font-size:13.5px;font-weight:700;line-height:1.5}.muted{font-size:12.5px;color:#6b8187}.rule{border:none;border-top:1px solid #e5ecec;margin:8px 0}
.goal{display:flex;gap:6px;align-items:center;margin:6px 0}.goal .gtext{flex:1;font-size:12.5px;line-height:1.45;min-width:0}.goal button{border:1px solid #cbdcda;background:#eaf4f1;border-radius:6px;color:#3a7973;padding:4px 6px;font-size:13.5px;min-width:57px;white-space:nowrap}.goal button:hover{background:#d5ebe5}
textarea{width:100%;display:block;border:1px solid #d3e1e0;background:#fff;color:#243d42;border-radius:6px;resize:vertical;min-height:66px;font-size:12.5px;padding:9px;line-height:1.65}.smallnotice{font-size:11.5px;color:#83969a;margin-top:5px}
.talents .talent{border-left:3px solid #8babaa;padding:8px 10px;margin:7px 0;background:#f6faf9;border-radius:3px;font-size:12.5px;line-height:1.65;white-space:pre-wrap}
.metal-short{display:flex;flex-wrap:wrap;gap:4px}.metal-chip{font-size:11.5px;border:1px solid #d6e3e1;background:#eaf4f1;padding:3px 6px;border-radius:5px;color:#436b66}.metal-rule{font-size:12.5px;line-height:1.6;white-space:pre-wrap}.metal-ability{white-space:pre-wrap;font-size:12.5px;line-height:1.7;background:#f7fbfa;padding:9px 10px;border:1px solid #e1eae8;margin:6px 0;border-radius:6px}.metal-ability:first-child{border-left:3px solid var(--accent)}
.footer{font-size:11.5px;text-align:center;color:#8a9da1;margin-top:7px;padding-bottom:3px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#293f47;color:white;padding:7px 13px;border-radius:9px;font-size:12.5px;box-shadow:0 6px 25px #0003;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}.toast.show{opacity:1}
/* Compact mode can show more information on laptops without shrinking the browser zoom. */
body.compact .shell{padding:7px 9px 20px}body.compact .mast{min-height:98px;margin-bottom:6px;gap:6px}body.compact .board,body.compact .column{gap:6px}body.compact .hero img{width:65px;height:79px}body.compact .hero h1{font-size:18px}body.compact .hero{padding:6px 8px}body.compact .herochips{margin-top:4px}body.compact .defense .dv{font-size:23px}body.compact .resource .number{font-size:21px}body.compact .panel>summary{min-height:31px;padding:5px 9px}body.compact .panel .body{padding:6px 8px}body.compact .skills .body{padding:4px}body.compact .skills-col{gap:2px}body.compact .skill{min-height:23px;padding:2px 4px}body.compact .goal{margin:4px 0}body.compact .weapon>summary{padding:5px 7px}
@media (max-width:1220px){.toolbar{gap:8px}.brand small{display:none}.chooser label{display:none}.board{grid-template-columns:minmax(248px,.8fr) minmax(438px,1.43fr) minmax(290px,1.12fr)}.skill .name{font-size:11.5px}.skill button{min-width:55px;font-size:10.5px}.action{padding:6px 7px}}
@media (max-height:810px) and (min-width:961px){.footer{display:none}}
@media (max-height:740px) and (min-width:961px){.toolbar{min-height:46px;padding-top:4px;padding-bottom:4px}.shell{padding-top:7px}.mast{min-height:96px;margin-bottom:6px;gap:6px}.hero{padding:6px 9px}.hero img{width:64px;height:80px}.hero h1{font-size:18px}.herochips{margin-top:4px}.board,.column{gap:6px}.introline{margin-bottom:5px}.panel>summary{min-height:32px;padding:5px 9px}.skill{min-height:24px;padding:2px 5px}.skills-col{gap:2px}.weapon>summary{padding:6px 8px}.body{padding:7px 8px}.skills .body{padding:4px}.goal{margin:4px 0}}
@media (max-width:960px){.brand b{font-size:13.5px}.toolbar{flex-wrap:wrap}.chooser select{max-width:180px}.actions{width:100%;justify-content:flex-end}.mast{grid-template-columns:1fr 1fr}.resources{grid-column:1/-1;min-height:85px}.board{grid-template-columns:minmax(235px,.8fr) minmax(430px,1.42fr)}.col-right{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.board .col-mid{grid-column:2}.shell{padding:10px 10px 20px}}
@media (max-width:780px){.toolbar{position:relative}.board{display:flex;flex-direction:column}.column{width:100%}.col-right{display:flex;flex-direction:column}.mast{display:flex;flex-direction:column}.mast>.card{min-height:90px}.hero img{height:100px}.skills-3{grid-template-columns:repeat(3,minmax(0,1fr))}.skill .name{font-size:12.5px}.skill button{min-width:62px}.introline{flex-wrap:wrap}.panel>summary .preview{max-width:55%}}
@media (max-width:530px){.toolbar{gap:7px}.brand .sigil{display:none}.brand b{font-size:13.5px}.actions{justify-content:flex-start}.action{font-size:11.5px}.chooser{width:100%}.chooser select{max-width:100%;width:100%}.skills-3{grid-template-columns:1fr}.skills-col{gap:2px}.skill{min-height:32px}.skill .name{font-size:13.5px}.skill button{min-width:75px;font-size:12.5px}.mast{gap:6px}.resources{min-height:95px}.resource .step{gap:2px}.hero h1{font-size:19px}.introline{font-size:11.5px}}
@media print{body{background:#fff}.toolbar,.introline .quick-actions,.footer,.toast{display:none!important}.shell{padding:0}.board{grid-template-columns:.85fr 1.4fr 1.29fr}.panel,.card{break-inside:avoid;box-shadow:none}textarea{min-height:48px}}

/* Minimal screenshot-aligned refinements: keep the original three-column layout. */
.brand{gap:0;flex-shrink:0}
.brand .system-logo{display:block;width:auto;height:39px;max-width:175px;object-fit:contain}
.goals .quote,.goals .text-preview,.goals .goal .gtext{font-size:13.5px;font-weight:500;color:#344b53;line-height:1.5}
.goals .quote,.goals .text-preview{margin:4px 0 8px}
.resource .armor-note{font-size:11.5px;color:#607c85;line-height:1.1;margin:1px 0 0;white-space:nowrap}
.mast{margin-bottom:9px}
@media(max-width:700px){.brand .system-logo{height:32px;max-width:145px}}

/* 2026-11-20: Make the header and body use the same three-column tracks. */
.shell{--sheet-columns:minmax(220px,.84fr) minmax(450px,1.66fr) minmax(270px,1.10fr)}
.mast,.board{grid-template-columns:var(--sheet-columns)}
/* On narrower screens, switch both aligned grids to the same two-column tracks. */
@media (min-width:781px) and (max-width:1100px){
 .shell{--sheet-columns:minmax(220px,.91fr) minmax(400px,1.64fr)}
 .mast>.resources{grid-column:1/-1;min-height:80px}
 .board .col-left{grid-column:1}
 .board .col-mid{grid-column:2}
 .board .col-right{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media print{
 .shell{--sheet-columns:minmax(220px,.84fr) minmax(450px,1.66fr) minmax(270px,1.10fr)}
 .mast,.board{grid-template-columns:var(--sheet-columns)}
}

/* Editable boxings: buttons and direct number input */
.money{width:120px;min-width:116px;gap:4px;padding:5px 3px}
.money label{font-size:12.5px;font-weight:750;line-height:1.1}
.money-step{display:flex;align-items:center;justify-content:center;gap:3px;width:100%}
.money-step .stepbutton{width:24px;height:28px;flex:0 0 24px}
.money input{appearance:textfield;-moz-appearance:textfield;min-width:0;width:53px;height:29px;border:1px solid #d5dfdb;border-radius:6px;background:#fffaf1;color:#856b3c;text-align:center;font-weight:800;font-size:21px;padding:0 2px}
.money input::-webkit-outer-spin-button,.money input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money input:focus-visible{outline:2px solid #6eb7ad;outline-offset:2px}
@media (min-width:1101px) and (max-width:1250px){.money{width:108px;min-width:106px}.money input{width:40px;font-size:18px}.money-step{gap:2px}.money-step .stepbutton{width:22px;flex-basis:22px}.resource .step{gap:2px}}
@media (max-width:780px){.board .col-right{display:flex;flex-direction:column;grid-column:auto;grid-template-columns:none;width:100%;align-items:stretch}.board .col-right>.panel{width:100%}}
@media (max-width:530px){.resources{flex-wrap:wrap}.resource{flex:1 1 30%}.money{width:auto;min-width:0;flex:1 1 100%;flex-direction:row;gap:10px;border-top:1px solid var(--line)}.money-step{width:auto;gap:3px}.money input{width:56px;font-size:20px}}

攻擊的行動只需花費 1 點專注。\n・投擲［20/60］：可進行遠程攻擊。"},{"title":"【徒手攻擊（黃銅指節套）】近戰","detail":"+1 對抗 實體防禦\n（1d4+1 衝擊傷害）","summary":"+1 對抗 實體防禦","text":"【徒手攻擊（黃銅指節套）】近戰\n+1 對抗 實體防禦\n（1d4+1 衝擊傷害）"}],"core":"在沒有人願意挺身而出時，保護那些受壓迫的人。","barrier":"你不信任任何掌握權力的人，即使對方是你的盟友也一樣。","goals":[{"label":"保護反抗軍的秘密。","progress":0,"max":3,"cell":"Y12"}],"acting":"艾爾莎是個狡黠、反應敏捷的街頭孤兒，特別喜歡扒竊。如今她加入反抗軍，為那些在她成長過程中飽受苦難的親友而戰。\n\n運用「機會主義者」天賦，在大膽或冒險的行動中，可以詢問 GM 能否「提高賭注」。若出現變故，便可重新擲骰。\n\n使用「反抗怒視」壓制敵人；陷入力竭的敵人所有檢定受到 −2 懲罰。\n\n由於具有小刀專精，使用小刀副手攻擊只需花費 1 點專注及 1 個動作，就能再次進行攻擊檢定。","background":"你在陸沙德滿是灰燼的小巷裡長大，很早就學會躲在陰影中，也知道什麼時候該閉上嘴巴。\n\n加入當地的盜賊集團後，你終於感覺自己找到了歸屬。但某次行動出了差錯，為了保全自己，同伴竟把你丟給警備隊。\n\n你使盡本領逃出監禁，並下定決心再也不要加入會出賣自己的團伙。\n\n如今你投身司卡反抗軍，希望自己的本領終於能用在比掏空貴族口袋更有意義的事情上。\n\n信任對你而言並不容易，但也許，這群新同伴會有所不同。","equipment":"・皮甲（偏斜值 1）\n・兩把藏起來的刀\n・普通衣物\n・一小瓶威士忌\n・指節套\n・50 呎繩索\n・打火石與鋼片\n・油燈、燈油\n・五餐份口糧\n・撬棍：利用槓桿進行運動檢定時獲得優勢。\n・開鎖工具：相關巧手檢定獲得優勢。\n","expertise":"・地下世界\n・執法機關\n・司卡文化\n・小刀","talents":["【機會主義者】\n你憑本能察覺關鍵時刻。當局勢在災難與榮耀之間搖擺，你能逼自己一把，試試運氣，讓結果朝有利方向傾斜。\n\n每輪一次，當你擲劇情骰時，可以重擲。原本的結果不產生效果，而且你必須採用新結果。","【反抗怒視】（一個行動）\n反抗的火花削弱敵人的權威，消磨其意志。\n\n花費 2 點專注，對一名你能影響的角色進行洞察檢定（+5），對抗其靈魂防禦。成功時，若目標尚未力竭，便陷入力竭［−2］。"],"metal":null},{"key":"柯瑞爾","title":"Korril 柯瑞爾","path":"迷霧人（鋼）／領袖","race":"人類","level":1,"player":"","portrait":"data:image/webp;base64,UklGRio8AABXRUJQVlA4IB48AABQkQGdASqDARICPlEkjkSjoiEWKk1QOAUEsrdwufhW9Vqm+tHtskH5N8k/791fO8fR/7nrt/qH+59hbzsepL92/VH+5vqweof+/+o3/hOq39G7pof3d9MDURvYPnS6neNf5PtjHVvBT+W/qOST8q8Cr+2bbeSJztfcJreOh/8Hnz/L/+H6mBsscSUi0/jYnW9+ZdMRlxscSUi0/jY4kpFp+7k+uVCSbV4CwOlLm6PKBUATz4FZRKyy5VkjZLSRk3xZwlItP42N1mzcXUGTdCjnTWf/TjghXvijPcdAxqqdkzXj7yx2eM37xYdS+drMtJFhU5wlItP42LBifKDlLKIOFqrB+gCijcT/qSh6YQEKVPGpL+W/M1cF2993eofhgHvmBQfKnz8WcB9B/H+YOgfJyVoFkrNnV/VSCd7WbWtdM4hlwDbIPvH2i8zo3ARjpP8WB5a3JedPQUHyp89dUNYTkJoRS0prUU8phgwFez/0wDpW6iynA2wICN/+FMYHaoBv91Z19ek0sKKgc7hXacGsgwWc4nO8FsevsPYjHIdt8WcJSJ7KHZWQp5QuxR8rF1zygeG/qCHfKyEua/hw9SZOVz/uq4artZ0ZxNWhPlUozyrE+zDcNsz4vMCHQEdP5tDp2U09b6g6u90z8WcJRzKLHmTu6ai0JlpBx4sNI3Zo4KWfmWtAID8IOvyEueiS0 銳利傷害）\n・獨特：不受雙手特性限制。\n・專精：可單手持用短矛。"}],"core":"創造一個連被社會排斥的人都能找到歸屬的地方。","barrier":"你藉由不斷逼迫自己努力，掩飾內心對遭到逮捕的恐懼。","goals":[{"label":"訓練你的力量","progress":3,"max":3,"cell":"Y12"},{"label":"讓你的隊伍活下來","progress":0,"max":3,"cell":"Y13"}],"acting":"柯瑞爾是充滿自信、極具魅力的領袖，擅長在關鍵時刻鼓舞同伴採取行動。\n\n善用「果決號令」：花費 1 點專注，讓 20 呎內的盟友在下一次檢定加入 1d4。若是攻擊檢定，盟友能在看到結果後，將 d4 加到 d20 或傷害骰上。\n\n使用「燃燒鋼」偵測 40 呎內的金屬，並以「鋼推」改變位置、取得制高點或射出金屬投射物。\n\n短矛專精讓你能單手持矛，空出另一隻手進行其他動作。","background":"你是一名從外圍統治區逃出來的流亡者。繼續留在原處工作，遲早會被活活操勞至死。\n\n流浪生活教會你繪製安全路線、分配補給，並幫助惶恐的落難者活下去。漸漸地，其他流亡者開始追隨你，你也在保護他們的過程中找到意義。\n\n最後你輾轉來到陸沙德，熟悉街道、幫派與隱密通道，卻始終擔心鋼鐵教廷追來。\n\n你知道單靠躲藏無法真正安全。唯有站出來反抗，才能改變命運。而最後帝國的心臟，正是採取行動的地方。","equipment":"・破舊衣物\n・普通鋼屑金屬瓶\n・一袋銅幣","expertise":"・地下世界\n・製圖術\n・旅行者文化\n・司卡文化\n・短矛","talents":["【果決號令】（一個行動）\n你擁有指揮骰（1d4）。花費 1 點專注，指定 20 呎內一名你能影響的盟友。該盟友在下回合結束前的下一次檢定，可額外擲 1d4 並加入結果。\n\n若為攻擊檢定，目標可在看到擲骰結果後，將 d4 加到 d20 或傷害骰上。","【迷霧人覺醒】\n你因「綻裂」取得一種鎔金術能力。起初只能使用粗淺的版本，可能尚未察覺能力；透過訓練，便能掌握這股力量。\n\n鋼鎔金術的完整效果與用法，見下方「金屬技藝卡」。"],"metal":{"title":"鋼鎔金術｜金屬技藝卡","metrics":["金屬　鋼","調整值　+5","等級與上限　2","範圍　40 ft","技藝骰　1d6"],"description":"鋼鎔金術讓你看見從自身重心延伸至附近金屬物體重心的藍線。你能對這些金屬來源施展「鋼推」，使自己或物體遠離另一方，取決於哪一方較大。\n鋼鎔金師可以用驚人的速度射出小型金屬物體，因此也被稱作「射幣」。","abilities":["【迷霧人覺醒】\n當你發現自己的鋼鎔金術能力時，獲得「飲用金屬瓶」及尚未成熟的能力。","【飲用金屬瓶】（1 個行動）\n喝下一瓶含鋼屑的液體，恢復最多 5 點授予。鋼是常見金屬，因此通常不必記錄這類金屬瓶的剩餘數量。","【燃燒鋼】（1 個行動）\n只要你仍有授予，就能燃燒少量鋼，無須花費資源，偵測 40 呎內每一處未受授予的金屬來源。\n你可以用自由行動免費維持此效果。","【鋼推】（1 個行動）\n燃燒鋼時，花費 1 或 2 點授予，推動一件你偵測到的金屬物體。選擇以下一種效果：\n\n・推動：你與物體之中較小的一方，沿直線被推離另一方。每花費 1 點授予，最多移動 20 呎。物體連接的東西也須計入其大小。若物體撞上建築或地面等更大的表面，物體就會停止移動，改由你被推動剩餘距離。\n\n・射擊硬幣：推動一件小型金屬物體，以強勁力量射出，作為危險的投射物。每花費 1 點授予，最多射出 20 呎。以遠程鎔金術攻擊（+5）對抗實體防禦，命中造成 1d6+5 衝擊傷害。"],"note":"金屬技藝卡註記：「訓練你的力量」目標已完成，能完整使用此處描述的效果。"}},{"key":"拉克","title":"Lark 拉克","path":"迷霧人（鋅）／使者","race":"人類","level":1,"player":"","portrait":"data:image/webp;base64,UklGRsBMAABXRUJQVlA4ILRMAADQtwGdASqDARICPlEkj0SjoiGUyk14OAUEsrd7YLlcmm/AAyBfi2MN3vf+V7yf5tPw97XcvnjPt/9L16/2bpp+n7zZecL6jf75v1nou9NFjjkyDn7/J8V7LIKD89/V/9DkR4FP5X/af99687fq3W8z+MjzhcnsdR/2//r/sPVX+ef77/4e4z/PP70Y5F+0S +4 衝擊傷害）\n・慣性：若攻擊前朝目標移動至少 10 呎，此次攻擊有優勢。"},{"title":"【戰鎚】武器專精","detail":"以戰鎚為主要武器。","summary":"","text":"【戰鎚】武器專精\n以戰鎚為主要武器。"},{"title":"【鋅鎔金術】","detail":"可在交涉或戰鬥中煽動情緒；具體檢定、範圍與消耗，見下方金屬技藝卡。","summary":"","text":"【鋅鎔金術】\n可在交涉或戰鬥中煽動情緒；具體檢定、範圍與消耗，見下方金屬技藝卡。"}],"core":"揭露「貴族天生就比其他人優越」這個謊言。","barrier":"你很難信任別人，因為害怕他們會利用你的秘密來傷害你。","goals":[{"label":"訓練你的力量","progress":2,"max":3,"cell":"Y12"},{"label":"讓一位有權勢的盟友站到你這邊","progress":0,"max":3,"cell":"Y13"}],"acting":"拉克是一位足智多謀的店主，越有壓力越能發揮。她能憑自身的存在激怒敵人，也能鼓舞盟友。\n\n多使用「鼓舞存在」，讓盟友獲得堅定；具有堅定狀態的角色在檢定失敗時，可為結果加入一次機遇，隨後移除堅定。\n\n鋅鎔金術能在不開口的情況下煽動他人的情緒；目前尚未完成「訓練你的力量」目標，先使用初生鋅鎔金術的效果。完成後才能解鎖「燃燒鋅」。\n\n持戰鎚沿直線移動至少 10 呎後攻擊，可因「慣性」獲得優勢。","background":"你成長於鄔都（Urteau）一個貴族商人家庭，從小熟悉舞會與政治交際，也察覺人們的情緒會相互影響。\n\n你運用天賦協助家族談生意，後來加入鋼鐵教廷，成為前途看好的官僚。教廷磨練你身為煽動者的技巧，並派你前往資源廷參與談判。\n\n然而，帳冊揭露了令你不安的真相：最後帝國的財富本可讓司卡免於深重苦難。\n\n理想破滅後，你逃往陸沙德，在鐵匠鋪工作，從鍛造鋼鐵中找到人生方向。如今你暗中為司卡反抗軍供應武器，同時擔憂鋼鐵教廷是否仍在追捕自己。","equipment":"・戰鎚\n・皮甲（偏斜值 1）\n・普通金屬瓶（鋅，內含鋅屑）\n・裝有各種物資的箱子：\n　・普通衣物\n　・手術用品（10 次；消耗 1 次，醫藥檢定獲得優勢）\n　・弱效消毒劑（5 劑；短休消耗 1 劑，恢復 1d6 生命）\n　・墨水筆、墨水瓶\n　・羊皮紙 5 張、蠟燭 5 根\n　・打火石與鐵片\n　・空玻璃瓶 3 個\n　・音叉、小提琴、天平","expertise":"・鋼鐵教廷\n・裝備製作\n・陸沙德文化\n・司卡文化\n・鎚","talents":["【鼓舞存在】（1 個行動）\n你能僅憑手勢、神情或寥寥數語，激勵他人發揮出色。\n\n選擇一名你能影響的盟友，該盟友獲得「堅定」狀態，直到其從該狀態獲益，或場景結束為止。\n\n具有堅定的角色在檢定失敗時，可以為結果加入一次機遇，之後移除堅定狀態。","【迷霧人覺醒】\n你曾經「綻裂」，取得一種鎔金術能力。起初只能使用粗淺的版本，甚至可能沒有察覺；經過練習或訓練，才能掌握完整力量。\n\n鋅鎔金術的初生能力、金屬瓶及完整版本「燃燒鋅」，詳見下方金屬技藝卡。"],"metal":{"title":"鋅鎔金術｜金屬技藝卡","metrics":["金屬　鋅","調整值　+4","等級與上限　2","範圍　40 ft","技藝骰　1d6"],"description":"鋅鎔金術可悄然煽動附近人的情緒，促使對方依照情緒行事，卻以為那是自己的主意，因此鋅鎔金師又稱「煽動者」。\n例如，你可以在舞會上煽動貴族的衝動，使他失態；也能煽動陌生人的信任以取得協助。經過訓練，甚至能同時煽動不同情緒。\n注意：煽動者無法藉此感知他人的情緒，仍須以一般方式判斷情緒狀態。","abilities":["【迷霧人覺醒】\n你因綻裂取得鋅鎔金術，獲得「飲用金屬瓶」行動，以及尚未成熟的「初生鋅鎔金術」。完成「訓練你的力量」目標後，解鎖完整版本的「燃燒鋅」。","【飲用金屬瓶】（1 個行動）\n喝下一瓶含鋅屑的液體，恢復最多 5 點授予。鋅是常見金屬，因此通常不必記錄這類金屬瓶的剩餘數量。","【初生鋅鎔金術】（目前可用）\n只要你仍有授予，就可以：\n・消耗一次「機遇」，嘗試憑直覺使用尚未成熟的能力。\n・或使用「使用技能」（1 個行動），主動進行鎔金術檢定（+4），對抗 GM 設定的難度（DC）。\n\n檢定結果：\n・成功或獲得機遇：煽動 10 呎內一名角色的情緒，持續 1 輪。\n・失敗或出現變故：可能有人察覺自己的情緒受到煽動，或發現你是煽動者。","【燃燒鋅】（2 個行動；完成目標後解鎖）\n花費 1 或 2 點授予，選擇一種要煽動的情緒，並在自身 40 呎內指定一個 10 呎範圍的區域。\n\n對區域內每個目標分別進行鎔金術檢定（+4），對抗其靈魂防禦。\n・所有目標都會強烈感受到被煽動的情緒，直到你的下一個回合結束。\n・除非你對某個目標的鎔金術檢定失敗，否則該目標不會察覺你正在操縱其情緒。\n・察覺的目標可在自己回合開始時，以自由行動花費等同你所消耗授予的專注點，抵抗此效果 1 輪。\n\n你可使用一次自由行動，花費至少 1 點授予，將效果再維持 1 輪。"],"note":"「訓練你的力量」目標尚未完成：先使用初生鋅鎔金術；完成後才解鎖「燃燒鋅」。"}},{"key":"諾薇安","title":"Novienne 諾薇安","path":"獵手（殺霧者）","race":"人類","level":1,"player":"","portrait":"data:image/webp;base64,UklGRoRQAABXRUJQVlA4IHhQAAAwvQGdASqDARICPlEgjUQjoiMYKpXQOAUEsrdwuPA/NcaU+xnyMkl5b9NY5X+fvf+A8wf3Hvmf+L1w+Tf0mvOT5xnqd/w2/c+hB02FqDtmvKfvPB8d18DexP/i+KP5p/Z+hT+V/2Hz7ZZnWrcDk08jL+50Kv/L4HyESnO3IeArAJ+U4FrudI8WWOMNH8yoHlP2Tdm+OCY3gW8pLQc0Li8+GPyBPrHOun3WLe2GWdyD8sDWwNakTyEGnkqvU+GM6M/zfDOsImMKGP6LtSUZN/v3pkf0H/j0jQfqi3jHYF/4ktlkVPf8VWbToBevtiCy2DFHQi15e0+tc853xGgsh2QNp++Ma8lcc/mcFUc65B4RqCKXwDZCPyb0DfoUKd4QdP3EJH7h0lvVUTX7rI9UQQMN+fhF01gl9P6BvGt3ZjYQq3f2S/WXkBP6go0aTzvDW81kJhk/La1o4w3xKcHfT2jc9sMwDsDWwNK2E93B0V140P1A/KtfiRgwm7iN+7hBdPl/tEOPPJ/Z3YMs2gquzVvxHQbCQphk3sqwnYZnXcgPUR+IHQ8u2Osmi/z9KGDfIKyCs1/Kc9sj9k7n3ohNwf9HlUvR2RDsDWwCYIEEfwPJs3i5haxamcJnzj77/S+XUe8wwFTngB7mJjkMK117da0S5lKEVhQS56Pt4LudBlmX23oO+vITgiIPdArbGMCWz2C8v4DQe6gniGMjvfyd2B6c2ZwtXC9XALaWpbDkRvG2he9KuFo7nu70Q5Poq86lDXMVaDiP3NAHNe3vhzleNrhz3G1io14g2uD6Mw1qwJ7Lbva4cyAwKBG+5hUG5g98QB2j4b6wXBUlSqpt9zEI03wxL1GeSQ9jMDBYM1FGsZci1dZrDklFCWnwIcld+pWzSIlclmcD5ffrDSe89LI55rOg4lgI++iKgMLTYON1JvuXhTU74Yumbmo51yDkEp/v4yRSTfQyffwSm1vq7KoGJrjnOHWCZsoGSes+ve7NC1f9WUT64COjFbhhVmNQMhtW5i1p4dVyz3/JkwkusFNPyW687Pf5jYH1AJAzIbfNEc+8S3S3PQoapVRzfv0rS8dr4uOHeNRNo9orGKMMxQKiSQpDaUwbaSQLo1788O7zhUf7cu/Z9vsc9cadMFo8r+de2WJctZxSKGpq8QYl2UoMwHJ5fPEMOsSLWoYzXFqHAldBrWhUNSq0mSvizUMJCG7uxskdCCVYZm2NXuptFNGI715qdNSNWNpsc3/yLoEqpRdx3yBkE82qBgDUdLAmucH6SjrS4ETfu/GCR1R2kJ8IM9R2MSuLVbPI0lIGoBY+ETTp6vzL6/5hbuT+DgeAMzRw4v0Sx/mS5ElMoMtw+omqFPM4zdlW7rZU6WHyle8XwjLQmxBUlZAXQiG6L9ljJC83uP8Ubxz/URmJgITPgH7eJp1yDltoPYSiDy9oQ0ZMN/abISUaFJLh8g7PzOFAsj7CpZn2lAyzFCzeoj0mdvwjeLKT2Pfp1+yAYeqoQA02wfP4UYf8Rl52gxOYDHohQHwHIQB2nP63EF3po5uYAYqkIUzkcVK mmary":"+5 對抗實體防禦（1d4+6 銳利傷害）","text":"【玻璃匕首】近戰\n+5 對抗實體防禦（1d4+6 銳利傷害）\n・投擲［20/60］：可遠程攻擊。\n・易碎：出現變故時可能損壞。\n・低調：隱藏武器的相關檢定有優勢。\n・速拔：取出武器不需行動。\n・副手：副手攻擊只消耗 1 點專注。"}],"core":"證明你的本領足以與任何金屬技藝使用者匹敵。","barrier":"無論自己的話是否傷人，你總是有話直說。","goals":[{"label":"保護那些無力反抗貴族的人。","progress":0,"max":3,"cell":"Y12"},{"label":"10","progress":0,"max":3,"cell":"Y13"}],"acting":"諾薇安目光銳利、言詞尖刻。她很少主導社交場合的談話，但洞察力敏銳，在戰鬥中則是精準且危險的近戰戰士。\n\n休息期間或非戰鬥場景中，可以使用「追尋獵物」，將可疑人物或已知敵人指定為獵物。追蹤、攻擊與研究該目標時獲得優勢。\n\n透過「殺霧者武裝」，你能免費拔出決鬥杖與玻璃匕首，也能以 1 點專注及 1 個動作進行副手攻擊。玻璃匕首可以投擲，但出現變故時可能碎裂。","background":"你曾是中央統治區里內爾家族（House Rinel）備受期待的繼承人，自幼學習紀律、傳統與榮譽。\n\n有一天，父親為掩蓋自己的債務，下令公開處決整隊司卡勞工。你看清了那些教誨只是維持腐敗貴族階級的謊言，於是放棄頭銜，以傭兵身分謀生，最終加入殺霧者的行列。\n\n儘管如此，家族的記憶與名聲依舊糾纏著你。你不允許家族的腐敗，成為世人對自己名字的最後評價。\n\n【聯繫：貴族家族贊助人】你受到蓋維爾・西里斯（Guiverre Seeris）庇護，這份贊助視同一個貴族家族。替他辦事時可獲適當住宿與交通，也可請求介紹、文件或服務等較小規模的人脈，範圍由 GM 裁定。","equipment":"・木胸甲（偏斜值 2）\n・制服\n・決鬥杖\n・玻璃匕首\n・普通衣物\n・水袋\n・放大鏡\n・鐐銬\n・撬棍\n・口糧（10 餐份）","expertise":"・上流社會\n・中央統治區\n・司卡文化\n・決鬥手杖\n・玻璃匕首","talents":["【殺霧者武裝】\n你精心準備刀刃與彈藥來對抗鎔金術師。\n\n當你持用專為對抗授予技藝而設計的武器，該武器取得「速拔」特性，命中或擦傷時額外造成 1 點傷害，角色卡的武器傷害已包含此加值；此外獲得玻璃匕首專精。","【追尋獵物】\n花費 1 分鐘，將一名目前能感知到、或曾經遭遇過的角色指定為獵物。\n\n你在尋找、攻擊或研究該獵物的檢定上獲得優勢，例如透過「取得優勢」研究目標。效果持續至使用 0 動作主動結束，或改指定新的獵物為止。"],"metal":null},{"key":"托拉文","title":"Toraven 托拉文","path":"迷霧人（錫）／學者","race":"人類","level":1,"player":"","portrait":"data:image/webp;base64,UklGRkw3AABXRUJQVlA4IEA3AACwLwGdASpiAcEBPlEij0WjoaER+DYAOAUEs7dr2iv3pp8CCh16qb64/HqSvl/zh/t5aO/OQzbc9Qf9o9Gn0weozzkear6lv7dv3O9V39j6LrMvXCMk795Fnzj9OyPbzT5w/jxkgOL+tG5HTtH+55q/0P/gewv+vf/W6aD2XzG4S5HwMIEWr3BB5xvaF5Q00l8Jcj4IkZuqviUzc+GXBl/dC0HkGeO/MCrJy3NCmMFKPdLybKSxrUriWk/j848iBJLXckBr6kZuqvkEj29vWjV0Hv0eG9ByYLpWlj5+g5JRJ17BbSqoYGCWFJgMMjGawdcoCePIMP6ugPDLDc+U2a4SH+FyyRm6q+QSPb3pb9mlHBQn9t3tyP4hhP9loI3TyVGsV2HrZ8Ulrg9PfQZe3VRyFM0hb1K235eURD3UFJd+9fd9QMlw8nyCR7fD6+5rPB4wRDAoIkfv5st47UPud1TcUzP1kgEf2ac1rk8pUvmluTV+S0M94gvoIxVjTC9YfNHe0ESM3VXeahKNsy/yIEmylRVLQYuNYx/Oad1PXWQVYx1haYUlon3IjvZ+dBTw3CR8YCEYlPWyCB1n2sD5VQgHhIJHwRIxvXh1fAYeWf8ot0/KeqBrLvYIx1aR detail":"+4 對抗實體防禦（1d4+4 衝擊傷害）\n・低調：隱藏武器的相關檢定有優勢。\n・間接：能以弧線射擊越過掩體，無視敵人的架防。","summary":"+4 對抗實體防禦（1d4+4 衝擊傷害）","text":"【投石索】遠程［30/120］\n+4 對抗實體防禦（1d4+4 衝擊傷害）\n・低調：隱藏武器的相關檢定有優勢。\n・間接：能以弧線射擊越過掩體，無視敵人的架防。"},{"title":"【徒手攻擊】近戰","detail":"+1 對抗實體防禦（2 衝擊傷害）","summary":"+1 對抗實體防禦（2 衝擊傷害）","text":"【徒手攻擊】近戰\n+1 對抗實體防禦（2 衝擊傷害）"},{"title":"【短矛】近戰（目前未持有）","detail":"+4 對抗實體防禦（1d8+4 銳利傷害）\n・獨特：不受雙手特性限制。","summary":"+4 對抗實體防禦（1d8+4 銳利傷害）","text":"【短矛】近戰（目前未持有）\n+4 對抗實體防禦（1d8+4 銳利傷害）\n・獨特：不受雙手特性限制。"}],"core":"揭開掌權者企圖掩埋的秘密。","barrier":"你會追查每一個謎團，即使這會讓你偏離眼前的任務。","goals":[{"label":"訓練你的力量。","progress":0,"max":3,"cell":"Y12"},{"label":"學到能被你拿來當作武器的秘密。","progress":0,"max":3,"cell":"Y13"}],"acting":"托拉文是學識淵博的學者，熱愛閱讀、破解密碼，也善於發現別人忽略的細節。\n\n錫鎔金術能強化感官，適合尋找微小線索；突然遇到巨大聲響或強光時，記得避免過度刺激。\n\n戰鬥時你較脆弱，可花費 1 點專注進行閃避反應，讓攻擊你的敵人獲得劣勢。每個場景一次，還能花費 2 個行動使用「恢復」，擲 1d6 恢復生命或專注。\n\n投石索可以越過掩體以間接射擊；若敵人接近，可花費 2 個行動收起投石索並拔出在冒險中取得的近戰武器。","background":"你在陸沙德的司卡貧民住宅區長大，家人都在布維達家族的產業工作。\n\n你遇見一位泰瑞司管事。她看出你的好奇心，冒著極大風險，秘密教你讀寫。在灰燼中寫下的文字與雜務空檔的謎語，讓你看見遠比工廠與運河更廣闊的世界。\n\n最近你為了維持生計，幾乎什麼工作都願意做，卻始終深深著迷於知識。\n\n你如飢似渴地閱讀每一本能找到的書，深信統御主的帝國建立在刻意掩埋的真相之上。你知道有一群人可能握有更多秘密：司卡反抗軍。","equipment":"・制服（偏斜值 0，外觀得體）\n・投石索\n・裝有各種物資的背包：\n　・普通衣物\n　・墨水筆、墨水瓶\n　・紙張 20 張\n　・提燈\n　・密碼學參考書\n　・鎖與鑰匙","expertise":"・鋼鐵教廷\n・密碼學、文學、冶金學\n・陸沙德文化\n・司卡文化\n・泰瑞司文化\n・投石索、短矛","talents":["【博學】\n你能迅速吸收、歸檔、回憶資訊，經短暫密集研讀就能在新領域達到驚人的熟練度。\n\n選擇一項認知技能或實用專長（目前為密碼學），及兩項不同的認知技能（目前為學識與醫藥）。視為具有選定專長，指定兩項技能各獲得額外 1 個技能等級。\n\n每次長休息後，只要能使用圖書館，就可重新分配這些選擇。","【迷霧人覺醒】\n你因「綻裂」取得錫鎔金術能力，初期只能使用粗淺的版本。經過練習或訓練，就能掌握完整力量。\n\n金屬技藝卡上「訓練你的力量」尚未勾選，因此目前使用初生錫鎔金術。完整版本「燃燒錫」需要完成目標後才能解鎖。"],"metal":{"title":"錫鎔金術｜金屬技藝卡","metrics":["金屬　錫","調整值　+3","等級與上限　2","範圍　40 ft","技藝骰　1d6"],"description":"錫系金屬技藝能大幅強化你的感官。雖然使用者被稱為「錫眼」（Tineye），燃燒這種金屬強化的其實是所有感官。\n因此錫眼適合擔任守衛或斥候，尤其是在光線昏暗的環境中。","abilities":["【迷霧人覺醒】\n發現錫鎔金術時，你獲得「飲用金屬瓶」行動與尚未成熟的錫鎔金術。\n\n完成「訓練你的力量」目標後，才能穩定地運用完整的「燃燒錫」。","【飲用金屬瓶】（1 個行動）\n喝下一瓶含錫屑的液體，恢復最多 5 點授予。錫是常見金屬，因此通常無須記錄這類金屬瓶的剩餘數量。","【初生錫鎔金術】（目前可用）\n只要你還有授予之力，就可以：\n・消耗「機遇」，憑直覺嘗試使用尚未成熟的能力。\n・或使用「使用技能」（1 個行動），進行鎔金術檢定（+3） ],"weapons":[{"title":"【徒手攻擊】近戰","detail":"+5 對抗實體防禦（1d4+5 衝擊傷害）\n・慣性：攻擊前向目標移動至少 10 呎，這次攻擊獲得優勢。\n・副手：副手攻擊只消耗 1 點專注。","summary":"+5 對抗實體防禦（1d4+5 衝擊傷害）","text":"【徒手攻擊】近戰\n+5 對抗實體防禦（1d4+5 衝擊傷害）\n・慣性：攻擊前向目標移動至少 10 呎，這次攻擊獲得優勢。\n・副手：副手攻擊只消耗 1 點專注。"},{"title":"【十字弓】遠程［100/400］、雙手武器（目前未持有）","detail":"+3 對抗實體防禦（1d8+3 銳利傷害）\n・裝填［1］：裝 1 支弩矢需花 1 個動作。\n・致命：命中時，可透過機遇造成傷勢。","summary":"+3 對抗實體防禦（1d8+3 銳利傷害）","text":"【十字弓】遠程［100/400］、雙手武器（目前未持有）\n+3 對抗實體防禦（1d8+3 銳利傷害）\n・裝填［1］：裝 1 支弩矢需花 1 個動作。\n・致命：命中時，可透過機遇造成傷勢。"}],"core":"讓你的憤怒成為真正有意義的力量。","barrier":"你總是忍不住投入戰鬥，即使明明轉身離開才是更明智的選擇。","goals":[{"label":"訓練你的力量。","progress":3,"max":3,"cell":"Y12"},{"label":"擊敗一名強大的敵人。","progress":0,"max":3,"cell":"Y13"}],"acting":"喬斯是一位飽經風霜、脾氣暴躁的碼頭工人，擅長近身格鬥。起始沒有武器或護甲，但徒手攻擊專精讓他的雙拳十分致命。\n\n攻擊前沿直線移動至少 10 呎可取得優勢，之後可再花 1 點專注及 1 個動作，進行副手攻擊。\n\n戰鬥初期使用 1 個行動進入「警戒架勢」，後續的閃避與反應攻擊便不用花費專注，能協助隊伍堅守防線。\n\n青銅鎔金術能感知附近正在使用授予的來源；青銅容易補充，適合持續燃燒。也別忘了善用「恢復」恢復生命或專注。","background":"你從小在陸沙德的碼頭工作，搬運貨箱，只要能賺錢，什麼差事都願意接。\n\n後來你被強行徵召進入統御主的軍隊。在各個統治區之間的零星戰鬥中，你學會如何生存，也見識到帝國戰爭如何輕易消耗人命。\n\n多年軍旅生活讓你更堅強冷硬，也讓被命令所做的事使你的心愈發冷酷。最後，你受夠了替別人打仗，逃離軍隊。\n\n回到陸沙德後，逃兵難以找到正當工作。反抗軍卻不會問太多問題，報酬也還不錯。\n\n既然還是必須流血戰鬥，你希望至少為自己真正認同的理念而戰。","equipment":"・破舊衣物\n・50 呎繩索\n・普通青銅金屬瓶\n\n起始時沒有十字弓，也沒有護甲。","expertise":"・軍旅生活\n・陸沙德文化\n・司卡文化\n・徒手攻擊\n・十字弓","talents":["【警戒架勢】（1 個行動）\n你研習特殊戰鬥風格，藉此因應各種敵人與戰術。\n\n進入此架勢後，進行「閃避」與「反應攻擊」所需的專注點減少 1 點。","【迷霧人覺醒】\n你因綻裂取得青銅鎔金術能力，起初只能使用粗淺版本，甚至可能尚未察覺。\n\n你已完成「訓練你的力量」目標，可以使用完整的「燃燒青銅」。詳見下方金屬技藝卡。"],"metal":{"title":"青銅鎔金術｜金屬技藝卡","metrics":["金屬　青銅","調整值　+5","等級與上限　2","範圍　40 ft","技藝骰　1d6"],"description":"青銅鎔金術能讓你感知附近動態授予所發出的、如鼓聲般有節奏的脈動。司卡德利亞最常見的來源是正在燃燒金屬的鎔金術師。\n青銅鎔金師可以追蹤其他鎔金術師，因此稱為「搜尋者」。","abilities":["【迷霧人覺醒】\n當你發現自己的青銅鎔金術能力時，獲得「飲用金屬瓶」以及能力的初生版本。\n\n目前「訓練你的力量」目標已完成，因此解鎖完整版的「燃燒青銅」。","【飲用金屬瓶】（1 個行動）\n喝下一瓶含青銅屑的液體，恢復最多 4 點授予。青銅是常見金屬，通常不用記錄這類金屬瓶的剩餘數量。","【燃燒青銅】（1 個行動；目前可用）\n消耗 1 或 2 點授予，在接下來的 2 回合內，能偵測 40 呎範圍內的授予來源，獲得以下效果：\n\n・感知授予：察覺他人何時消耗授予，以及何時有持續性的授予能力正在運作。\n\n・追蹤來源：無須消耗動作，選定一個授予來源，知道其精確位置，並在移動時持續追蹤。同時追蹤的效果數量上限等於此次消耗的授予點數。","【燃燒青銅】（其餘效果）\n・辨識金屬：可以使用 1 個行動，進行 DC 15 的鎔金術檢定；成功時辨識產生該效果所燃燒的金屬種類。\n\n・維持效果：使用一次自由行動，額外消耗至少 1 點授予，使效果延長 1 回合。\n\n以上皆為完整「燃燒青銅」的效果。"],"note":"「訓練你的力量」目標已完成：可完整使用燃燒青銅。"}}];
const STORE_KEY='mistborn-hope-interactive-v1';
let selected=0;let compact=false;let saved={};
try{saved=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');if(!saved||typeof saved!=='object'||Array.isArray(saved))saved={};}catch(_){saved={};}
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const plain=x=>esc(x).replace(/\n/g,'<br>');
const clip=(x,n)=>String(x||'').length>n?String(x).slice(0,n-1)+'…':String(x||'');
const ch=()=>CHARACTERS[selected];
const defaultOpen={skills:true,weapons:true,expertise:true,goals:true,notes:true};
function state(){let c=ch(),s=saved[c.key];if(!s||typeof s!=='object'){s={};saved[c.key]=s} s.resources??=Object.fromEntries(c.resources.map(r=>[r.label,r.now]));s.money??=c.money;s.goals??=c.goals.map(g=>g.progress);s.ranks??=Object.fromEntries(c.skills.flat().map(r=>[r.cell,r.rank]));s.status??='';s.memo??='';s.panels??={...defaultOpen};return s;}
function moneyValue(){const n=Number(state().money);return Number.isFinite(n)?Math.max(0,Math.floor(n)):Math.max(0,Math.floor(Number(ch().money)||0))}
function dots(n,max){n=Math.min(max,Math.max(0,Number(n)||0));return '●'.repeat(n)+'○'.repeat(max-n);}
let toastTimer=null;
function message(txt){const n=$('toast');n.textContent=txt;n.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),1800)}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(saved));}catch(_){message('瀏覽器未允許儲存；請匯出進度檔備份')}}
function panel(id,title,body,preview='',hint=''){const s=state(),open=s.panels?.[id]??!!defaultOpen[id];return `<details class="panel ${esc(id)}" data-panel="${esc(id)}" ${open?'open':''}><summary><span>${esc(title)}</span>${preview?`<span class="preview">${esc(clip(preview,70))}</span>`:''}${hint?`<span class="meta">${esc(hint)}</span>`:''}</summary><div class="body">${body}</div></details>`;}
function resources(){const s=state();return ch().resources.map(r=>{let now=Math.min(r.max,Math.max(0,Number(s.resources[r.label]??r.now)||0));return `<div class="resource"><span class="label">${esc(r.label)}</span><div class="step"><button class="stepbutton" data-res="${esc(r.label)}" data-delta="-1" aria-label="${esc(r.label)}減一">−</button><span class="number">${now}</span><span class="max">/${r.max}</span><button class="stepbutton" data-res="${esc(r.label)}" data-delta="1" aria-label="${esc(r.label)}加一">+</button></div>${r.label==='生命'?`<div class="armor-note">${esc(ch().armor||'護甲偏斜值：0')}</div>`:''}</div>`}).join('')}
function header(){const c=ch();return `<div class="mast"><section class="card hero"><img src="${c.portrait}" alt="${esc(c.key)}肖像"><div><h1>${esc(c.title)}</h1><div class="sub">${esc(c.path)} · ${esc(c.race)} · 等級 ${c.level}</div><div class="herochips"><span>${esc(c.speed)}</span><span>${esc(c.recovery)}</span><span>${esc(c.sense)}</span><span>${esc(c.capacity)}</span></div></div></section><section class="card defenses">${c.defenses.map(d=>`<div class="defense"><span class="dt">${esc(d.name)}</span><span class="dv">${d.val}</span><span class="att">${d.ability.map(a=>`<span>${esc(a.label)} <strong>${a.val}</strong></span>`).join('')}</span></div>`).join('')}</section><section class="card resources" style="--r-count:${c.resources.length}">${resources()}<div class="money"><label for="moneyInput">盒金</label><div class="money-step"><button type="button" class="stepbutton" data-money="-1" aria-label="盒金減一">−</button><input id="moneyInput" type="number" inputmode="numeric" min="0" step="1" value="${moneyValue()}" aria-label="盒金數量"><button type="button" class="stepbutton" data-money="1" aria-label="盒金加一">+</button></div></div></section></div>`}
function skillPanel(){const c=ch(),s=state();const b=`<div class="skills-3">${c.skills.map((column,i)=>`<div class="skills-col" aria-label="第${i+1}欄技能">${column.map(r=>{let n=s.ranks[r.cell]??r.rank;return `<div class="skill"><span class="num">${r.bonus==null?'':(r.bonus>=0?'+':'')+r.bonus}</span><span class="name" title="${esc(r.name)}">${esc(r.name)}</span><button data-skill="${esc(r.cell)}" aria-label="${esc(r.name)}：技能等級 ${n}，點擊增加">${dots(n,r.max)}</button></div>`}).join('')}</div>`).join('')}</div>`;return panel('skills','技能檢定',b,'','點圓圈調整技能等級')}
function weaponsPanel(){const c=ch();const b=c.weapons.map((w,i)=>`<details class="weapon" data-weapon="${i}"><summary><span class="weapon-name">${esc(w.title)}</span><span class="weapon-blurb">${esc(clip(w.summary||w.detail,70))}</span></summary><div class="weapon-text">${esc(w.text)}</div></details>`).join('');return panel('weapons','武器與攻擊',b,c.weapons.map(w=>w.title).join(' / '),'點武器展開細節')}
function expertisePanel(){let tags=ch().expertise.split('\n').map(s=>s.replace(/^・/,'').trim()).filter(Boolean);return panel('expertise','專長與訓練',`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`,tags.join('、'))}
function goalsPanel(){let c=ch(),s=state(),b=`<div class="eyebrow">核心目的</div><p class="quote">${plain(c.core)}</p><div class="eyebrow">內在障礙</div><p class="text-preview">${plain(c.barrier)}</p><hr class="rule"><div class="eyebrow">短期目標 · 點擊圓圈記錄</div>${c.goals.length?c.goals.map((g,i)=>`<div class="goal"><span class="gtext">${esc(g.label)}</span><button data-goal="${i}" aria-label="${esc(g.label)}進度：${s.goals[i]??g.progress}">${dots(s.goals[i]??g.progress,g.max)}</button></div>`).join(''):'尚未設定短期目標'}`;return panel('goals','目的、障礙與短期目標',b,clip(c.core,35))}
function talentsPanel(){const c=ch();let titles=c.talents.filter(Boolean).map(t=>(t.match(/^【[^】]+】/)||[t.split('\n')[0]])[0]);let b=c.talents.filter(Boolean).map(t=>`<div class="talent">${esc(t)}</div>`).join('');return panel('talents','天賦能力',b,titles.join(' · '))}
function metalPanel(){const m=ch().metal;if(!m)return '';let b=`<div class="metal-short">${m.metrics.map(x=>`<span class="metal-chip">${esc(x)}</span>`).join('')}</div><div class="eyebrow">金屬的力量</div><div class="metal-rule">${esc(m.description)}</div><div class="eyebrow">金屬技藝與行動</div>${m.abilities.map(a=>`<div class="metal-ability">${esc(a)}</div>`).join('')}<div class="metal-ability">${esc(m.note)}</div>`;return panel('metal',m.title,b,m.metrics.slice(1,4).join(' ・ '))}
function equipPanel(){return panel('equipment','護甲與裝備',`<div class="copy">${plain(ch().equipment)}</div>`,ch().equipment.replace(/\n/g,'　').slice(0,34))}
function actPanel(){return panel('acting','角色扮演與戰術提醒',`<div class="copy">${plain(ch().acting)}</div>`,ch().acting.slice(0,32))}
function storyPanel(){return panel('story','背景故事與聯繫',`<div class="copy">${plain(ch().background)}</div>`,ch().background.slice(0,32))}
function notesPanel(){const s=state();let b=`<label class="eyebrow" for="statusNote">狀態、傷勢與臨時效果</label><textarea id="statusNote" placeholder="例：力竭［−2］、持傷、堅定…">${esc(s.status)}</textarea><label class="eyebrow" for="memoNote">冒險筆記與聯繫</label><textarea id="memoNote" placeholder="戰利品、線索、聯繫、備忘…">${esc(s.memo)}</textarea><div class="smallnotice">自由填寫，資料只會儲存在本機瀏覽器。</div>`;return panel('notes','狀態與筆記',b)}
function render(){let y=window.scrollY,c=ch();$('characterSelect').value=String(selected);$('characterRoot').innerHTML=`${header()}<div class="board"><div class="column col-left">${goalsPanel()}${expertisePanel()}</div><div class="column col-mid">${skillPanel()}${weaponsPanel()}${talentsPanel()}${metalPanel()}</div><div class="column col-right">${equipPanel()}${actPanel()}${storyPanel()}${notesPanel()}</div></div>`;bind();window.scrollTo(0,y)}
function applyOpen(mode){const panels=document.querySelectorAll('[data-panel]');const s=state();for(let el of panels){let open=mode==='all'||(mode==='quick'&&!!defaultOpen[el.dataset.panel]);el.open=open;s.panels[el.dataset.panel]=open;}save();}
function bind(){const s=state();document.querySelectorAll('[data-panel]').forEach(el=>el.addEventListener('toggle',()=>{state().panels[el.dataset.panel]=el.open;save()}));document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{let label=b.dataset.res,orig=ch().resources.find(r=>r.label===label),delta=Number(b.dataset.delta),v=Number(state().resources[label]??orig.now);state().resources[label]=Math.max(0,Math.min(orig.max,v+delta));save();render()});document.querySelectorAll('[data-money]').forEach(b=>b.onclick=()=>{state().money=Math.max(0,moneyValue()+Number(b.dataset.money));save();render()});const moneyInput=$('moneyInput');if(moneyInput){moneyInput.addEventListener('input',()=>{if(moneyInput.value!==''&&Number.isFinite(Number(moneyInput.value))){state().money=Math.max(0,Math.floor(Number(moneyInput.value)));save()}});moneyInput.addEventListener('change',()=>{if(moneyInput.value!==''&&Number.isFinite(Number(moneyInput.value))){state().money=Math.max(0,Math.floor(Number(moneyInput.value)));save()}moneyInput.value=moneyValue()})}document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{let key=b.dataset.skill,item=ch().skills.flat().find(r=>r.cell===key);s.ranks[key]=((s.ranks[key]??item.rank)+1)%(item.max+1);save();render()});document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{let i=+b.dataset.goal,max=ch().goals[i].max;s.goals[i]=((s.goals[i]??ch().goals[i].progress)+1)%(max+1);save();render()});const st=$('statusNote');if(st)st.addEventListener('input',()=>{state().status=st.value;save()});const mn=$('memoNote');if(mn)mn.addEventListener('input',()=>{state().memo=mn.value;save()});}
function exportSave(){const raw=JSON.stringify({type:'mistborn-hope-character-state',version:1,exportedAt:new Date().toISOString(),data:saved},null,2);const blob=new Blob([raw],{type:'application/json'}),link=URL.createObjectURL(blob),a=document.createElement('a');a.href=link;a.download='迷霧之子角色卡_進度紀錄_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(link),1000)}
async function importSave(e){let file=e.target.files?.[0];if(!file)return;try{const p=JSON.parse(await file.text());if(p?.type!=='mistborn-hope-character-state'||!p.data||typeof p.data!=='object'||Array.isArray(p.data))throw Error('這不是相容的角色卡進度檔');const names=new Set(CHARACTERS.map(c=>c.key));for(const n of Object.keys(p.data))if(!names.has(n))throw Error('進度包含未知角色');if(!confirm('將以這份檔案取代本機的進度紀錄，確定匯入？'))return;saved=p.data;save();render();message('已匯入進度')}catch(e){alert('匯入失敗：'+(e.message||e))}finally{e.target.value=''}}
function init(){if((window.innerWidth<=1100||window.innerHeight<=820)&&window.innerWidth>780){compact=true;document.body.classList.add('compact');$('compactBtn').textContent='舒適模式';}const select=$('characterSelect');select.innerHTML=CHARACTERS.map((c,i)=>`<option value="${i}">${esc(c.key)} · ${esc(c.path)}</option>`).join('');select.addEventListener('change',()=>{selected=Number(select.value);window.scrollTo(0,0);render()});$('expandBtn').onclick=()=>applyOpen('all');$('foldBtn').onclick=()=>applyOpen('quick');$('compactBtn').onclick=()=>{compact=!compact;document.body.classList.toggle('compact',compact);$('compactBtn').textContent=compact?'舒適模式':'緊湊模式'};$('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(_){message('可使用 F11 切換瀏覽器全螢幕')}};$('exportBtn').onclick=exportSave;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=importSave;render()}
init();
</script></body></html>
