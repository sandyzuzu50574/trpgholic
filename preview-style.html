<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我喜歡區塊預覽</title>
<style>
:root{--ink:#15211d;--muted:#64706b;--line:#dce3df;--paper:#fbfdfc;--accent:#0d8b67}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px}
.site-header{display:flex;align-items:center;justify-content:space-between;height:62px;padding:0 max(24px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line)}
.brand{font-size:13px;font-weight:700}.brand span{color:var(--accent)}nav{display:flex;gap:24px;color:var(--muted);font-size:12px}
.preview-space{max-width:1180px;margin:0 auto;padding:54px 24px 34px}.preview-space h1{margin:0;font-size:clamp(36px,7vw,76px);letter-spacing:-.06em}.preview-space h1 span{color:var(--accent)}
.fold-title{display:flex;line-height:1;letter-spacing:-.05em;font-weight:600}.fold-action{color:var(--muted);font-size:12px}
.style-fold,.experience-fold{max-width:1180px;margin:0 auto;padding:0 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.style-fold summary,.experience-fold summary{display:flex;align-items:center;justify-content:space-between;padding:24px 0;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}.style-fold .fold-title{flex-direction:row;align-items:baseline;gap:14px;font-size:clamp(27px,3vw,36px)}
.fold-title small{margin:0;color:var(--accent);font-size:10px;letter-spacing:.16em}.style-fold[open] .fold-action{font-size:0}.style-fold[open] .fold-action::after{content:"收起 －";font-size:12px}
.style-list{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 22px;padding:0;list-style:none}
.style-list li{display:flex;min-height:82px;flex-direction:column;align-items:flex-start;justify-content:center;padding:14px 16px;border-radius:3px;background:var(--accent);color:#fff;font-size:14px;line-height:1.45;letter-spacing:-.02em}
.style-fold[open] .style-list li{animation:style-card-enter .68s cubic-bezier(.22,.8,.3,1) both}.style-fold[open] .style-list li:nth-child(2){animation-delay:.1s}.style-fold[open] .style-list li:nth-child(3){animation-delay:.2s}.style-fold[open] .style-list li:nth-child(4){animation-delay:.3s}.style-fold[open] .style-list li:nth-child(5){animation-delay:.4s}@keyframes style-card-enter{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.experience-fold{border-top:0}.experience-fold summary{padding:30px 0}.experience-fold .fold-title{flex-direction:column;gap:16px;font-size:clamp(34px,4vw,52px)}
@media(max-width:760px){.site-header nav{display:none}.preview-space{padding-top:42px;padding-bottom:28px}.preview-space h1{font-size:38px}.style-fold summary{padding:18px 0}.style-fold .fold-title{gap:10px;font-size:26px}.style-list{display:flex;overflow-x:auto;margin-bottom:16px;scroll-snap-type:x proximity;scrollbar-width:thin}.style-list li{min-height:72px;flex:0 0 min(72vw,230px);padding:12px 16px;scroll-snap-align:start;font-size:14px;line-height:1.4}.experience-fold summary{padding:22px 0}.experience-fold .fold-title{font-size:30px}}
@media(prefers-reduced-motion:reduce){.style-fold[open] .style-list li{animation:none}}
</style>
</head>
<body>
<header class="site-header"><div class="brand">ZUZU <span>／</span> TRPG-holic</div><nav>我喜歡！　我做過！　帶過的團　跑過的團</nav></header>
<section class="preview-space"><h1>ZUZU<span>｜</span>TRPG-holic</h1></section>
<details class="style-fold"><summary><span class="fold-title"><small>01</small>我喜歡！</span><span class="fold-action">展開查看 ＋</span></summary>
<ol class="style-list"><li>理解角色，成為角色的粉絲</li><li>重視共同創作與交流互動</li><li>喜愛即興回應與關係敘事</li><li>玩出系統與劇本的風味</li><li>再加一點我們都喜歡的東西</li></ol></details>
<details class="experience-fold"><summary><span class="fold-title"><small>02</small>我做過！</span><span class="fold-action">展開查看 ＋</span></summary></details>
</body></html>
